# JavaChat Server Configuration
# ---------------------------------

# Server port (default: 12345)
server.port=12345

# Gemini AI API key
# Set via environment variable only — never commit a key here.
# export GEMINI_API_KEY=your_key_here && java -jar chat-server.jar

# Gemini AI model fallback list (optional — comma-separated, newest first)
# If omitted, defaults to: gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-pro
# server.gemini.models=gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-pro

# Logging configuration
# See src/main/resources/logging.properties for log level and format settings.
