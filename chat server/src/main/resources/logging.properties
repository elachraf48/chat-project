# Java Util Logging configuration for JavaChat Server
# Place this file on the classpath (src/main/resources) and pass to JVM:
#   -Djava.util.logging.config.file=logging.properties

# Root logger: INFO to console
.level=INFO
handlers=java.util.logging.ConsoleHandler

# Console handler settings
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Compact single-line format: [LEVEL] HH:mm:ss message
java.util.logging.SimpleFormatter.format=[%4$s] %1$tH:%1$tM:%1$tS %5$s%n

# Reduce noise from Jackson / JDK internals
com.fasterxml.jackson.level=WARNING
sun.level=WARNING
